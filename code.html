        <p>this code is about cars</p>
        <h1>I have a Rose Royal it is a McLaren</h1>
        <p id="details"></p>
        <script>
            class car {
                constructor(brand){
                    this.carname=brand;
                }
                present(){
                    return 'I have a'+ this.carname;
                }
            }
            class Model extends car{
                constructor(brand,mod){
                    super(brand);
                    this.model=mod;
                }
                show(){
                    return this.present()+ ',it is a' + this.model;
               }
            }
             let mycar = new Model("Rose Royal","McLaren");
            document.getElementById("details").innerHTML = mycar.show();
            </script>
    </body>
</html>
